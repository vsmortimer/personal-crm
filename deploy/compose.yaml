# The app and its own Postgres on the server: compose project "prod" or "staging" (the test
# stand), the same file for both. Every deploy copies deploy/ to /srv/<environment>/deploy;
# deploy.sh runs this file with APP_TAG set to the commit to run, and with the project name,
# the port and the memory limits of the environment (lib.sh, use_environment).
# Database and login settings come from /srv/<environment>/.env, each environment has its own:
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, BETTER_AUTH_SECRET, BETTER_AUTH_URL, SMTP_URL,
# MAIL_FROM and OWNER_EMAIL. Without any of them compose stops at the first step of a deploy.
# The scripts pass -p too; the name here, prod unless told otherwise, keeps a bare
# `docker compose` from starting a second stack with an empty database.
name: ${COMPOSE_PROJECT_NAME:-prod}

x-database-settings: &database-settings
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

# What the app needs to sign people in and to send them the link by email. The one-off
# container that applies migrations and `deploy.sh seed` are this same service, so they get
# these too; OWNER_EMAIL is what migration 0004 and the demo data need.
x-login-settings: &login-settings
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
  OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}

# Logs of the containers go to the server's journal (journald), not to files of the container:
# they stay after the container is recreated or removed, which every deploy and rollback does,
# and so do the lines of the one-off migration container. The system limits the size of the
# journal and deletes its oldest lines itself. Each service adds its own tag (<project>-app,
# <project>-db), the name to read its lines by: journalctl -t prod-app
x-logging: &logging
  driver: journald

services:
  db:
    # Pinned by digest: every deploy runs the same Postgres build
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # 0 means no limit: prod has none, the stand is capped (lib.sh)
    mem_limit: ${DB_MEM_LIMIT:-0}
    environment: *database-settings
    # No published port: only the app reaches the database, over the compose network
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    logging:
      <<: *logging
      options:
        tag: ${COMPOSE_PROJECT_NAME:-prod}-db
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # GitHub Actions pushes the image to GHCR and deploy.sh pulls it; compose never pulls it
    image: ghcr.io/vsmortimer/personal-crm:${APP_TAG:?APP_TAG is set by deploy.sh}
    pull_policy: never
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: [*database-settings, *login-settings]
      POSTGRES_HOST: db
    ports:
      # nginx proxies the environment's address here: prod 3000, the stand 3001
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      <<: *logging
      options:
        tag: ${COMPOSE_PROJECT_NAME:-prod}-app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3

volumes:
  db-data:
