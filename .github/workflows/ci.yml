# Every pull request: the checks that must pass before it can be merged into main.
# Each job is a required status check of main (branch protection on GitHub):
# renaming a job means updating the protection too.
name: CI

on:
  pull_request:

# A new push to the pull request cancels the run for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Fix locally with: pnpm format
      - run: pnpm format:check

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  vitest:
    name: Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway database that lives only for this job; the tests create
    # their own "_test" database next to it, see test/test-database.ts
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the emails the app sends; the tests read them over its API
      # (test/mailpit.ts). Nothing leaves the job
      mail:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: crm
      # Sign-in settings for the tests: not secrets, they protect nothing.
      # The emails go to the Mailpit container above, never to a real mailbox
      BETTER_AUTH_SECRET: Hs8Lw3Nq7Vb2Tk9Xc4Rj6Mf5Pd1Yg0Ae
      BETTER_AUTH_URL: http://127.0.0.1:3000
      SMTP_URL: smtp://127.0.0.1:1025
      MAIL_FROM: Личная CRM <noreply@mail.crm.app.example-crm.site>
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  playwright:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same throwaway database as in the vitest job; the e2e tests use their
    # own "_e2e_test" database next to it
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the emails the app sends; the tests read them over its API
      # (test/mailpit.ts). Nothing leaves the job
      mail:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: crm
      # Sign-in settings for the tests: not secrets, they protect nothing.
      # The emails go to the Mailpit container above, never to a real mailbox
      BETTER_AUTH_SECRET: Hs8Lw3Nq7Vb2Tk9Xc4Rj6Mf5Pd1Yg0Ae
      BETTER_AUTH_URL: http://127.0.0.1:3100
      SMTP_URL: smtp://127.0.0.1:1025
      MAIL_FROM: Личная CRM <noreply@mail.crm.app.example-crm.site>
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the browser and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      # Screenshots and traces of failed tests: download the artifact from the
      # run's page, unzip it and run: pnpm exec playwright show-report <folder>/playwright-report
      - name: Keep the report of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build as in deploy.yml, only nothing is pushed
      - name: Build the image
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" .
