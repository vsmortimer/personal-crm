# Every push to main: build the app image, push it to GHCR tagged with the commit and deploy it.
# The deploy itself lives in deploy/: ci-deploy.sh runs here, deploy.sh on the server.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one after another, a newer push never cancels a deploy halfway
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Push the image; the server pulls it with this job's token
  packages: write

env:
  IMAGE: ghcr.io/vsmortimer/personal-crm

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and push it to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/ci-deploy.sh
