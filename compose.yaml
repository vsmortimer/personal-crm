name: personal-crm

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bind to localhost only so the database is not reachable from the local network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends: nothing leaves this computer.
  # Open http://localhost:8025 to read the emails
  mail:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      # Bind to localhost only, the emails may hold sign-in links
      - "127.0.0.1:1025:1025" # SMTP: where the app sends emails
      - "127.0.0.1:8025:8025" # web page and API: where they are read

volumes:
  db-data:
